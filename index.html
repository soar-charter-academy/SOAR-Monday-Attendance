<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  app-version: bump this (and the matching ?v= below) on every deploy.
  app.js polls this file for a version change so a browser tab left open
  from a previous Monday picks up updates on its own — see checkForUpdate()
  in app.js. Nothing else needs to change when you bump it.
-->
<meta name="app-version" content="1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Monday Attendance</title>
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<header class="app-header">
  <div class="title-block">
    <h1>Monday Attendance</h1>
    <p id="todayLabel" class="today-label"></p>
  </div>
  <div class="header-actions">
    <button id="syncAeriesBtn" class="btn btn-secondary" type="button">Sync from Aeries</button>
    <button id="aeriesSettingsBtn" class="btn btn-secondary" type="button" title="Aeries sync settings">⚙️ Aeries Settings</button>
    <button id="uploadRosterBtn" class="btn btn-secondary" type="button">Upload Roster (CSV)</button>
    <button id="sampleRosterBtn" class="btn btn-secondary" type="button">Load Sample Roster</button>
    <button id="exportBtn" class="btn btn-secondary" type="button">Export Today's Attendance (CSV)</button>
    <button id="resetBtn" class="btn btn-danger" type="button">Reset Today</button>
  </div>
</header>

<input type="file" id="csvFile" accept=".csv" hidden>

<dialog id="aeriesSettingsDialog" class="aeries-dialog">
  <form method="dialog" id="aeriesSettingsForm">
    <h2>Aeries Live Sync Settings</h2>
    <p class="dialog-help">
      Paste the URL of your deployed Aeries sync proxy (see
      <code>aeries-proxy/README.md</code>) and the shared secret you set up
      for it. This is saved only in this browser.
    </p>
    <label>Sync proxy URL
      <input id="aeriesWorkerUrl" type="url" placeholder="https://your-worker.workers.dev" required>
    </label>
    <label>Shared secret
      <input id="aeriesSharedSecret" type="password" placeholder="shared secret" autocomplete="off">
    </label>
    <label class="checkbox-label">
      <input id="aeriesAutoRefresh" type="checkbox">
      Auto-refresh roster while this page is open
    </label>
    <label>Refresh every
      <select id="aeriesRefreshMinutes">
        <option value="5">5 minutes</option>
        <option value="15" selected>15 minutes</option>
        <option value="30">30 minutes</option>
        <option value="60">60 minutes</option>
      </select>
    </label>
    <p id="aeriesLastSynced" class="dialog-help"></p>
    <div class="dialog-actions">
      <button type="button" id="aeriesSettingsCancel" class="btn btn-secondary">Cancel</button>
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
</dialog>

<main>
  <section class="search-panel" aria-label="Student check-in">
    <label for="searchInput">Check in a student</label>
    <div class="search-box">
      <input id="searchInput" type="text" autocomplete="off"
             placeholder="Start typing a student's name..." aria-describedby="rosterStatus">
      <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
    </div>
    <p id="rosterStatus" class="roster-status"></p>

    <details id="walkinDetails" class="walkin">
      <summary>Student not on the list? Add a walk-in</summary>
      <form id="walkinForm" class="walkin-form">
        <input id="walkinName" type="text" placeholder="Student name" required>
        <select id="walkinGrade" required>
          <option value="" disabled selected>Grade</option>
          <option value="TK">TK</option>
          <option value="K">K</option>
          <option value="1">1st</option>
          <option value="2">2nd</option>
          <option value="3">3rd</option>
          <option value="4">4th</option>
          <option value="5">5th</option>
          <option value="6">6th</option>
          <option value="7">7th</option>
          <option value="8">8th</option>
        </select>
        <button type="submit" class="btn btn-primary">Check In Walk-in</button>
      </form>
    </details>
  </section>

  <section class="rosters" id="rosters" aria-label="Live room rosters"></section>
</main>

<div id="toast" class="toast" hidden></div>

<script src="app.js?v=1"></script>
</body>
</html>
